<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booking</title>
  <link rel="stylesheet" href="styles/global.css">
</head>
<body class="booking-page">
  <main class="booking-container">
    <h1>Booking A Session</h1>
    <p class="subheading">Reserve your seat for a workout session here!</p>

    <section class="booking-section">
      <label class="section-title" for="form_personalInfo">Personal Information</label>
      <form id="form_personalInfo" class="booking-form">
        <div class="form-group">
          <label for="name">Name-Surname:</label>
          <input type="text" id="name" placeholder="name-surname">
        </div>
        <div class="form-group">
          <label for="contact">Contact Number:</label>
          <input type="text" id="contact" placeholder="contact-number">
        </div>
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" placeholder="email">
        </div>
        <div class="form-group">
          <label for="age">Age:</label>
          <input type="number" id="age" placeholder="age">
        </div>
      </form>
    </section>

    <section class="booking-section">
      <label class="section-title" for="form_reservation">Class Reservation</label>
      <form id="form_reservation" class="booking-form">
        <div class="form-group">
          <label for="list_workouts">Choose a workout session</label>
          <select id="list_workouts" name="Workout Session" size="1">
            <option value="boxing">Boxing</option>
            <option value="yoga">Yoga</option>
            <option value="swimming">Swimming</option>
            <option value="zumba">Zumba</option>
          </select>
        </div>
        <div class="form-group">
          <label for="list_date">Choose your workout date</label>
          <input type="date" placeholder="date">
        </div>
        <div class="form-group">
          <label for="list_time">Choose a period</label>
          <select id="list_time" name="Workout Session" size="1">
            <option>09:00–10:30</option>
            <option>10:30–12:00</option>
            <option>13:00–14:30</option>
            <option>16:00–17:30</option>
          </select>
        </div>

        <div class="form-group radio-group">
          <div class="field-label">ระดับประสบการณ์ในการออกกำลังกาย</div>
          <div class="radio-options">
            <label class="radio-label">
              <input type="radio" name="experience" value="never">
              1) ไม่เคยเข้าคลาสมาก่อน
            </label>
            <label class="radio-label">
              <input type="radio" name="experience" value="some">
              2) มีประสบการณ์เล็กน้อย
            </label>
            <label class="radio-label">
              <input type="radio" name="experience" value="regular">
              3) ออกกำลังกายรูปแบบนี้เป็นประจำ
            </label>
          </div>
        </div>

        <div class="form-group textarea-group">
          <label for="limitations">ข้อมูลเกี่ยวกับข้อจำกัดในการออกกำลังกายหรือข้อความเพิ่มเติม</label>
          <textarea id="limitations" name="limitations" rows="5" placeholder="ระบุข้อจำกัดหรือข้อความเพิ่มเติม..."></textarea>
        </div>

        <div class="form-group checkbox-group">
          <label class="confirm-label">
            <input type="checkbox" id="confirmation" name="confirmation">
            ข้าพเจ้ายืนยันว่าข้อมูลที่กรอกเป็นความจริง และเข้าใจว่าการส่งแบบฟอร์มนี้ยังไม่ถือเป็นการยืนยันสิทธิ์เข้าเรียน
          </label>
        </div>
      </form>
    </section>
  </main>

  <div id="studentBottomCenter" class="student-identification">
    Ausakorn Chiralertwittayaphorn 6631362021
  </div>
</body>
</html>
